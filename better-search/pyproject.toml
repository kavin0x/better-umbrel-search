[project]
name = "better-search"
version = "3.3"
description = "Lightweight semantic file search for umbrelOS"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "openpyxl>=3.1",
    "pillow>=11",
    "pillow-heif>=0.21",
    "pypdf>=5",
    "pypdfium2>=4",
    "pytesseract>=0.3",
    "python-docx>=1.1",
    "python-magic>=0.4",
    "python-pptx>=1.0",
    "sqlite-vec>=0.1.6",
    "strawberry-graphql[fastapi]>=0.250",
    "uvicorn>=0.32",
    "watchdog>=6",
    "xxhash>=3.5",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
