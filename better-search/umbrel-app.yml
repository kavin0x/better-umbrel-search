manifestVersion: 1
id: better-search
name: Search
tagline: Semantic search for the main disk
icon: icon.svg
category: files
version: "0.3.2"
port: 8787
storage:
  dataRoot: data
folderAccess:
  - id: library
    name: Home
    note: Internal Home folder, mounted read-only at /library. External disks are not indexed.
    mounts:
      - service: app
        targetPath: /library
        readOnly: true
description: >-
  Search documents and photos on the main disk. The first run indexes what is
  already there, and new files are picked up as they appear. USB drives and
  other external disks are not indexed, even when they are mounted inside the
  library folder. In the app settings, add your Home folder on internal storage
  to the app service at /library, read-only.
developer: kavin0x
website: https://github.com/kavin0x/better-umbrel-search
repo: https://github.com/kavin0x/better-umbrel-search
support: https://github.com/kavin0x/better-umbrel-search/issues
submission: https://umbrel.com
releaseNotes: >-
  A search for a name or a filename stays on that file. "grandmas" matches
  grandma photos by name, and "paper by Anup Shah" ranks that document above
  an unrelated resume. Loose photo guesses are left out. PDF title and author
  metadata are indexed too.
gallery: []
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
