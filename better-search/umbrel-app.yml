manifestVersion: 1
id: better-search
name: Search
tagline: Find a file by what it is about
icon: icon.svg
category: files
version: "3.3.3"
port: 8787
storage:
  dataRoot: data
folderAccess:
  - id: library
    name: Home
    note: >-
      Home on the internal disk, mounted read-only at /library.
      USB drives and other external disks are not indexed.
    mounts:
      - service: app
        targetPath: /library
        readOnly: true
description: |-
  Search the Home folder on your main disk by describing the file. Notes, PDFs, Office documents, and photos are indexed, so a query can match the words inside a document or what a photo shows, not only the filename.

  The first run reads what is already there. Files you add later are picked up on their own. From inside the app you can pause indexing, or move one folder to the front of the line.

  In the app settings, add your Home folder on internal storage and mount it read-only on the app service at /library. Disks other than that one are skipped, including a folder inside Home that actually lives on a USB drive.
developer: kavin0x
website: https://github.com/kavin0x/better-umbrel-search
repo: https://github.com/kavin0x/better-umbrel-search
support: https://github.com/kavin0x/better-umbrel-search/issues
submission: https://umbrel.com
releaseNotes: |-
  The app opens again after this update on an existing install.

  The Home folder you mount is indexed when it is on the internal disk, even if the system marks that disk as removable. A folder inside Home that lives on a different disk is still skipped.
gallery: []
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
