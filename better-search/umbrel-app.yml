manifestVersion: 1
id: better-search
name: Search
tagline: Semantic search for the main disk
icon: icon.svg
category: files
version: "0.2.0"
port: 8787
storage:
  dataRoot: data
folderAccess:
  - id: library
    name: Home
    note: Internal Home folder, mounted read-only at /library. External disks are not indexed.
    mounts:
      - service: app
        targetPath: /library
        readOnly: true
description: >-
  Search documents and photos on the main disk. The first run indexes what is
  already there, and new files are picked up as they appear. USB drives and
  other external disks are not indexed, even when they are mounted inside the
  library folder. In the app settings, add your Home folder on internal storage
  to the app service at /library, read-only.
developer: Better Search
website: https://umbrel.com
repo: https://umbrel.com
support: https://umbrel.com
submission: https://umbrel.com
releaseNotes: >-
  Search results show a similarity score. Documents are embedded with
  Qwen3-Embedding-0.6B and photos with Jina CLIP. A folder can be indexed
  first without restarting the walk. The first launch rebuilds the index.
gallery: []
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
